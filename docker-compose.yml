version: '3.8'

services:
  machine-health-dashboard:
    build: .
    container_name: industrial_predictive_maintenance_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
